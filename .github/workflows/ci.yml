name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            printf '%s\n' 'PR title must follow Conventional Commits.'
            exit 1
          fi

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Build
        run: cargo build --workspace --all-targets --all-features --locked
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2
      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test platform-specific transport
        run: cargo test --workspace --all-features --locked

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Lint platform-specific transport
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test shared blocking frames
        run: cargo test --package mcpatch-bridge --lib --all-features --locked local_ipc::framing::tests
      - name: Test Windows endpoint names
        run: cargo test --package mcpatch-bridge --lib --all-features --locked local_ipc::windows::endpoint::tests
      - name: Test Windows election names
        run: cargo test --package mcpatch-bridge --lib --all-features --locked local_ipc::windows::election::tests
      - name: Test Windows identity rejection
        run: cargo test --package mcpatch-bridge --lib --all-features --locked local_ipc::windows::stream::tests
      - name: Test Windows protected DACL
        run: cargo test --package mcpatch-bridge --lib --all-features --locked local_ipc::windows::security::tests
      - name: Test Windows first-instance exclusion
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked first_pipe_instance_prevents_a_second_listener -- --exact --nocapture
      - name: Test Windows client authentication
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked authenticates_the_client_before_reading_a_bounded_frame -- --exact --nocapture
      - name: Test Windows adapter connection
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked adapter_connection_authenticates_server_and_classifies_unavailable -- --exact --nocapture
      - name: Test Windows Native Messaging channel
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked native_browser_channel_relays_and_closes_on_core_eof -- --exact --nocapture
      - name: Test Windows browser adapter negotiation
        run: cargo test --package mcpatch-bridge --test browser_adapter_integration --all-features --locked browser_negotiation_survives_violations_disconnect_and_core_restart -- --exact --nocapture
      - name: Test Windows isolated spawn configuration
        run: cargo test --package mcpatch-windows-kernel --lib --all-features --locked process::tests
      - name: Test Windows protected core election
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked protected_mutex_elects_one_core_and_releases_cleanly -- --exact --nocapture
      - name: Test Windows simultaneous core election
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked protected_mutex_allows_exactly_one_racing_core -- --exact --nocapture
      - name: Test Windows core restart
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked bridge_core_rejects_a_second_owner_and_restarts_with_a_fresh_epoch -- --exact --nocapture
      - name: Test Windows core peer lifecycle
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked bridge_core_counts_peers_and_rejects_malformed_frames -- --exact --nocapture
      - name: Test Windows partial-frame timeout
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked bridge_core_times_out_a_stalled_partial_frame -- --exact --nocapture
      - name: Test Windows bounded sessions
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked bridge_core_rejects_sessions_beyond_the_per_role_bound -- --exact --nocapture
      - name: Test Windows core shutdown
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked bridge_core_shutdown_stops_workers_and_releases_election -- --exact --nocapture
      - name: Test Windows core-owned MCP sessions
        run: cargo test --package mcpatch-bridge --test local_ipc_windows --all-features --locked bridge_core_owns_multiple_mcp_sessions -- --exact --nocapture
      - name: Test Windows process race and recovery
        run: cargo test --package mcpatch-bridge --test bridge_core_process --all-features --locked adapters_race_recover_and_observe_bounded_core_lifecycle -- --exact --nocapture
      - name: Test Windows MCP stdio end to end
        run: cargo test --package mcpatch-bridge --test mcp_stdio_process --all-features --locked initializes_lists_no_tools_and_keeps_logs_off_stdout -- --exact --nocapture

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Audit dependencies
        run: pnpm audit --audit-level high
