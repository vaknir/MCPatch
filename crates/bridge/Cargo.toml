[package]
name = "mcpatch-bridge"
description = "Native MCPatch policy and routing boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
jsonschema = { version = "=0.56.0", default-features = false }
rmcp = { version = "=3.3.0", default-features = false, features = ["server", "transport-io"] }
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
time = { version = "=0.3.47", features = ["parsing"] }
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["codec", "rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
url = "=2.5.8"

[[bin]]
name = "mcpatch"
path = "src/main.rs"
