[package]
name = "mcpatch-bridge"
description = "Native MCPatch policy and routing boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.3.4"
jsonschema = { version = "=0.56.0", default-features = false }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["codec", "rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
firehazard = "=0.0.0-2022-09-10"
interprocess = { version = "=2.4.4", features = ["tokio"] }
mcpatch-windows-kernel = { path = "../windows-kernel" }
widestring = "=1.2.1"
winreg = "=0.56.0"

[dev-dependencies]
base64 = "=0.22.1"

[[bin]]
name = "mcpatch"
path = "src/main.rs"
